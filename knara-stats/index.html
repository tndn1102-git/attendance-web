<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#F5EFE4" />
<title>K의 나라 운영 통계</title>
<link rel="stylesheet" href="assets/theme.css" />
<link rel="stylesheet" href="assets/dash.css" />
<link rel="stylesheet" href="assets/print.css" media="print" />
</head>
<body class="paper dash">

<div id="gate" hidden>
  <form id="gateForm" class="gate-box" autocomplete="off">
    <span class="seal lg" aria-hidden="true">K</span>
    <div class="gate-brand">청와대 사랑채 「K의 나라」</div>
    <h1>운영 통계</h1>
    <input id="gateKey" type="password" placeholder="접속 키" aria-label="접속 키" />
    <button type="submit" class="btn block">열기</button>
    <div id="gateErr" class="gate-err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="seal" aria-hidden="true">K</span>
      <div>
        <div class="brand-title">K의 나라 운영 통계</div>
        <div class="brand-sub">청와대 사랑채 국민화합 체험형 문화 프로그램</div>
      </div>
    </div>
    <div class="topbar-right">
      <span id="lastAt" class="last"></span>
      <button id="btnRefresh" class="btn ghost" type="button">새로고침</button>
      <button id="btnLogout" class="btn ghost" type="button">잠금</button>
    </div>
  </header>

  <div class="controls">
    <div class="period" id="period" role="group" aria-label="기간">
      <button type="button" data-p="today">오늘</button>
      <button type="button" data-p="7">7일</button>
      <button type="button" data-p="30">30일</button>
      <button type="button" data-p="exhibit">전시기간</button>
      <button type="button" id="toggleCustom" class="toggle-custom">기간 직접 지정 ▾</button>
      <span class="custom" id="customRange" hidden>
        <input type="date" id="fromDate" aria-label="시작일" /><span class="tilde">~</span>
        <input type="date" id="toDate" aria-label="종료일" />
        <button type="button" id="applyRange" class="btn ghost small">적용</button>
      </span>
    </div>
    <span id="rangeLabel" class="range-label"></span>
  </div>

  <nav class="tabs" id="tabs" role="tablist">
    <button type="button" data-v="overview">개요</button>
    <button type="button" data-v="games">놀이별</button>
    <button type="button" data-v="export">내보내기 / 인쇄</button>
    <button type="button" data-v="detail" class="tab-minor">자세히</button>
  </nav>

  <main id="content" class="content"><div class="loading">불러오는 중…</div></main>

  <footer class="foot"><span id="dbInfo"></span></footer>
</div>

<script src="assets/dash.js"></script>
</body>
</html>
