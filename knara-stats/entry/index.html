<style>

  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); word-break: keep-all; overflow-wrap: break-word; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 14px 16px 28px; }
  .head { display: flex; align-items: stretch; justify-content: space-between; padding: 2px 0 0; }
  .head .lead { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding-right: 12px; min-width: 0; }
  .head .lead .intro { font-family: var(--f-story); font-weight: 700; font-size: 16.5px; line-height: 1.6; margin: 12px 0 0; color: var(--c-ink); max-width: 250px; }
  .head .lead .org { font-size: 12.5px; color: var(--c-ink-mute); margin-top: 10px; line-height: 1.45; }

  .vtitle .gap { display: inline-block; width: 0; height: .3em; }

  .vtitle.latin { letter-spacing: .02em; }
  .vsub.latin { letter-spacing: .14em; }
  html[lang=ja] body, html[lang=zh] body { word-break: normal; }   /* 띄어쓰기 없는 언어는 keep-all 이면 카드 밖으로 넘침 */
  html[lang=en] .info dl, html[lang=es] .info dl { grid-template-columns: 92px 1fr; }
  html[lang=en] .info dt, html[lang=es] .info dt { white-space: normal; }
  .vtitle.horiz, .vsub.horiz { writing-mode: horizontal-tb; text-orientation: mixed; }  /* 세로가 너무 길면 가로 폴백(12자 이상) */
  .titles.horiz { flex-direction: column; align-items: flex-end; text-align: right; }
  .titles.horiz .vsub { margin: 0 0 4px; padding: 0; letter-spacing: .2em; }
  .titles.horiz .vtitle { font-size: 30px; letter-spacing: 0; }
  .saekdong { margin: 12px 0 12px; }
  .card + .card { margin-top: 10px; }
  /* 언어 다시 고르기 링크(바닥, 작게) */
  .langlink { display: inline-flex; align-items: center; margin-top: 14px; min-height: 36px; padding: 0 10px 0 8px; border-radius: var(--r-pill);
    background: rgba(255,255,255,.55); box-shadow: var(--inset-line); font-size: 13px; font-weight: 700; color: var(--c-ink-2); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .langlink svg { width: 16px; height: 16px; margin-right: 6px; }
  /* 접속 직후 언어 선택 팝업: 먹색 반투명 덮개 + 한지 상자 + 다섯 네모칸(각 언어 자기 표기) */
  #langPop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50;   /* id 선택자 = theme.css 의 body.paper > * { position: relative } 보다 우선 */ display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(33,30,26,.56); }
  #langPop[hidden] { display: none; }
  .langpop-box { background: var(--c-bg); border-radius: var(--r-card); box-shadow: var(--inset-line), 0 14px 40px rgba(0,0,0,.35); padding: 12px; max-width: 320px; }
  .langpop-grid { display: flex; flex-wrap: wrap; justify-content: center; }
  .langbox { flex: 0 0 auto; width: 88px; min-height: 56px; margin: 4px; padding: 6px 4px; border: 0; border-radius: var(--r-chip); background: rgba(255,255,255,.6); box-shadow: var(--inset-line);
    color: var(--c-ink); font-family: var(--f-ui); font-size: 15px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; white-space: nowrap; }

<script>
(function () {
  /* ───────── 설정 (발주처·운영사가 바꾸는 값). 화면 문구는 위 entry-text JSON 에 있다 ───────── */
  var CONFIG = {
    GAME_URL: "/game/",                                    // 게임 주소 — 같은 서버의 /game/ (노리개 DM 편). 다른 서버에 올리면 전체 주소로
    CONSENT_VERSION: "v1",                                 // 동의 문구를 바꾸면 v2, v3 … 로 올린다(이벤트에 실림)
    REQUIRE_CONSENT: false,                                // true = 동의 없이는 입장 불가("동의 없이 시작" 링크 숨김)
    PASS_LANG_QUERY: true,                                 // 게임 주소에 ?lang= 를 붙여 넘김(게임 쪽 지원 여부는 소스 확인)
    HANDOFF_SESSION: true,                                 // 게임이 다른 origin 이면 ?sid=&s0=(&kstat=off) 를 붙여 세션을 잇는다
    RETENTION: { events: 120, logs: 120 }                  // 보존기간(일) — 120일 뒤 `npm run wipe` 로 전부 수동 삭제
  };

  function $(id) { return document.getElementById(id); }
  var DATA = JSON.parse($("entry-text").textContent);
  var T = DATA.T, COMMON = DATA.common;
  var LANGS = [["ko", "한국어"], ["en", "English"], ["ja", "日本語"], ["zh", "中文"], ["es", "Español"]];
  var AGE_IDS = ["10s", "20s", "30s", "40s", "50s", "60s+"], GENDER_IDS = ["f", "m", "skip"];
  var state = { lang: "ko", age: "skip", gender: "skip" };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function hb(s) { return esc(s).replace(/&lt;br\s*\/?&gt;/gi, "<br>"); }   // 문구 안의 <br> 만 줄바꿈으로 허용(나머지 태그는 글자 그대로)
  function chips(elId, items, cur, onPick, keyPrefix) {
    var el = $(elId); el.innerHTML = "";
    items.forEach(function (it, i) {
      var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.innerHTML = hb(it[1]);
      b.setAttribute("aria-pressed", it[0] === cur ? "true" : "false");
      b.setAttribute("data-k", keyPrefix + "." + i);
      b.addEventListener("click", function () { onPick(it[0]); });
      el.appendChild(b);
    });
  }
  /* data-k = 편집기(scripts/entry-editor.js)가 문구를 JSON 키로 되돌릴 때 쓰는 표식. 동작에는 영향 없음 */
  function render() {
    var t = T[state.lang] || T.ko;
    document.documentElement.lang = state.lang;
    // 세로 타이틀: 띄어쓰기는 .gap 으로, 8자 이상이면 작게(.long), 12자 이상이면 가로 폴백(.horiz)
    var len = t.title.length, titles = $("titles"), h1 = $("t_title"), vs = $("t_vsub");
    h1.innerHTML = esc(t.title).replace(/ /g, '<span class="gap"></span>');
    h1.setAttribute("aria-label", t.title);
    h1.setAttribute("data-k", "title");
    var cjk = /[ㄱ-힝぀-ヿ一-鿿]/;
    var latin = (!cjk.test(t.title) && /[A-Za-z]/.test(t.title)) ? " latin" : "";   /* 한글·한자·가나가 섞인 제목(K의 나라)은 전부 세움 — 게임 타이틀과 동일 */
    h1.className = "vtitle" + latin + (len >= 12 ? " horiz" : len >= 8 ? " long" : "");
    vs.className = "vsub" + ((!cjk.test(t.vsub) && /[A-Za-z]/.test(t.vsub)) ? " latin" : "") + (len >= 12 ? " horiz" : "");
    titles.className = "titles" + (len >= 12 ? " horiz" : "");
    vs.innerHTML = hb(t.vsub); vs.setAttribute("data-k", "vsub");
    $("t_tag").innerHTML = hb(t.tag); $("t_tag").setAttribute("data-k", "tag");
    $("t_intro").innerHTML = hb(t.intro); $("t_intro").setAttribute("data-k", "intro");
    $("t_sub").innerHTML = hb(t.sub); $("t_sub").setAttribute("data-k", "sub");
    $("t_info").innerHTML = hb(t.info); $("t_info").setAttribute("data-k", "info");
    $("t_age").innerHTML = '<span data-k="age">' + hb(t.age) + '</span> <span class="opt" data-k="optional">' + hb(t.optional) + "</span>";
    $("t_gender").innerHTML = '<span data-k="gender">' + hb(t.gender) + '</span> <span class="opt" data-k="optional">' + hb(t.optional) + "</span>";
    $("t_consent").innerHTML = hb(t.consent); $("t_consent").setAttribute("data-k", "consent");
    $("btnStart").innerHTML = hb(t.start); $("btnStart").setAttribute("data-k", "start");
    $("btnSkip").innerHTML = hb(t.skip); $("btnSkip").setAttribute("data-k", "skip");
    $("btnSkip").style.display = CONFIG.REQUIRE_CONSENT ? "none" : "";
    $("t_org").innerHTML = hb(COMMON.ORG); $("t_org").setAttribute("data-k", "common.ORG");
    $("t_contact").innerHTML = hb(COMMON.CONTACT); $("t_contact").setAttribute("data-k", "common.CONTACT");
    var dt = function (s, k) { return '<dt class="' + (s.length > 6 ? "wide" : "") + '" data-k="' + k + '">' + hb(s) + "</dt>"; };
    $("infoBody").innerHTML = dt(t.h_collect, "h_collect") + '<dd data-k="collect">' + hb(t.collect.join(" · ")) + "</dd>"
      + dt(t.h_no, "h_no") + '<dd class="no" data-k="no">' + hb(t.no.join(" · ")) + "</dd>"
      + dt(t.h_why, "h_why") + '<dd data-k="why">' + hb(t.why.join(" · ")) + "</dd>"
      + dt(t.h_keep, "h_keep") + '<dd class="keep" data-k="keep">' + hb(t.keep.replace("{E}", CONFIG.RETENTION.events).replace("{L}", CONFIG.RETENTION.logs)) + "</dd>";
    $("langOpenName").textContent = (LANGS.filter(function (l) { return l[0] === state.lang; })[0] || LANGS[0])[1];
    $("langOpen").setAttribute("aria-label", t.langLabel);
    $("langPop").setAttribute("aria-label", t.langLabel);
    var grid = $("langGrid"); grid.innerHTML = "";
    LANGS.forEach(function (l) {
      var b = document.createElement("button"); b.type = "button"; b.className = "langbox"; b.textContent = l[1]; b.lang = l[0];
      b.setAttribute("aria-pressed", l[0] === state.lang ? "true" : "false");
      b.addEventListener("click", function () { state.lang = l[0]; render(); closeLangPop(); });
      grid.appendChild(b);
    });
    chips("ageChips", AGE_IDS.map(function (id, i) { return [id, t.ages[i]]; }), state.age, function (v) { state.age = state.age === v ? "skip" : v; render(); }, "ages");
    chips("genderChips", GENDER_IDS.map(function (id, i) { return [id, t.genders[i]]; }), state.gender, function (v) { state.gender = v; render(); }, "genders");
    $("btnStart").disabled = !$("agree").checked;
    $("err").textContent = "";
    if (window.__onEntryRender) { try { window.__onEntryRender(); } catch (_) {} }   // 편집기 훅(운영 중엔 없음)
  }

  // 게임이 같은 서버(/game/)면 세션은 sessionStorage 로 자동으로 이어지므로 주소에 sid 를 붙이지 않고,
  // 언어는 #lang= 으로 넘긴다 — 주소가 늘 "/game/" 로 같아야 아래에서 미리 받아 둔 사본이 그대로 쓰인다.
  function sameOrigin(u) { try { return new URL(u, location.href).origin === location.origin; } catch (_) { return false; } }
  function gameUrl() {
    var url = CONFIG.GAME_URL;
    if (sameOrigin(url)) return url + "#lang=" + encodeURIComponent(state.lang) + (/[?&]staff/.test(location.search) ? "&staff" : "");
    var extra = {};
    if (CONFIG.PASS_LANG_QUERY) extra.lang = state.lang;
    if (window.KStat && CONFIG.HANDOFF_SESSION) return KStat.handoffUrl(url, extra); // ?sid=&s0=(&kstat=off)&lang=
    var q = Object.keys(extra).map(function (k) { return k + "=" + encodeURIComponent(extra[k]); }).join("&");
    return q ? url + (url.indexOf("?") < 0 ? "?" : "&") + q : url;
  }
  function go(agreed) {
    try {
      if (window.KStat) {
        if (agreed) {
          KStat.lang(state.lang);
          KStat.demo({ age: state.age, gender: state.gender });
          KStat.consent({ agreed: true, version: CONFIG.CONSENT_VERSION });
        } else {
          KStat.consent({ agreed: false, version: CONFIG.CONSENT_VERSION }); // 기록 1건만 남기고 이후 수집 중단
        }
        KStat.flush();
      }
    } catch (_) {}
    var target = gameUrl();
    setTimeout(function () { location.href = target; }, 250); // 전송(sendBeacon/큐)에 잠깐 여유
  }

  function openLangPop() { $("langPop").hidden = false; var on = $("langGrid").querySelector('[aria-pressed="true"]'); if (on) { try { on.focus({ preventScroll: true }); } catch (_) { on.focus(); } } }
  function closeLangPop() { $("langPop").hidden = true; }
  $("langOpen").addEventListener("click", openLangPop);
  $("langOpen").addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLangPop(); } });
  $("agree").addEventListener("change", function () { $("btnStart").disabled = !$("agree").checked; $("err").textContent = ""; });
  $("btnStart").addEventListener("click", function () {
    if (!$("agree").checked) { $("err").textContent = (T[state.lang] || T.ko).needAgree; return; }
    $("btnStart").disabled = true; go(true);
  });
  function skip() { if (CONFIG.REQUIRE_CONSENT) return; go(false); }
  $("btnSkip").addEventListener("click", skip);
  $("btnSkip").addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); skip(); } });

  // 브라우저 언어로 초기 언어 추정(한국어 기본)
  var nav = (navigator.language || "ko").slice(0, 2);
  if (T[nav]) state.lang = nav;
  var hl = (location.search.match(/[?&]hl=([a-z]{2})/) || [])[1]; // ?hl=en 으로 초기 언어 지정(QR 별 안내판용)
  if (hl && T[hl]) state.lang = hl;
  window.__entry = { data: DATA, config: CONFIG, state: state, render: render };   // 편집기가 쓰는 손잡이(운영에는 영향 없음)
  render();
  // 손님이 안내문을 읽는 동안 게임(약 0.9MB)과 3D 라이브러리를 미리 받아 둔다 → 입장 누르면 바로 열림
  setTimeout(function () {
    try {
      if (!window.fetch || /[?&]__auto=/.test(location.search)) return;
      fetch(CONFIG.GAME_URL, { credentials: "same-origin" }).catch(function () {});
      fetch("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", { mode: "cors" }).catch(function () {});
    } catch (_) {}
  }, 600);
  // ?hl= 로 언어가 정해져 오지 않았으면(일반 QR) 접속 직후 언어 선택 팝업을 띄운다. 손님이 자기 언어를 고르면 닫힘
  if (!hl && !/[?&]__auto=/.test(location.search)) openLangPop();

  // 자동 시험 훅(검증 스크립트 전용): ?__auto=agree|skip 이면 20대·여성을 고르고 시작/건너뛰기를 누른 뒤 게임 대신 ?__done=1 로 이동
  var auto = (location.search.match(/[?&]__auto=(agree|skip)/) || [])[1];
  if (auto) {
    CONFIG.GAME_URL = location.pathname + "?__done=1";
    setTimeout(function () {
      state.age = "20s"; state.gender = "f"; render();
      if (auto === "agree") { $("agree").checked = true; $("btnStart").disabled = false; $("btnStart").click(); } else skip();
    }, 300);
  }
})();
</script>
</body>
</html>
